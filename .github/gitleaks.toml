title = "LocalHold gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Generated Git and Rust build data are scanned separately or reproducible"
paths = ['''(^|/)\.git/''', '''^\.cache/''', '''^\.cargo/''', '''^\.rustup/''', '''^target/''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Current and retired metadata migration sentinel comparisons are not credentials"
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*let unresolved_scope = scope_key == V2_UNRESOLVED_SCOPE;\s*$''',
  '''^\s*let unresolved_scope = scope_key == UNRESOLVED_SCOPE;\s*$''',
]
paths = ['''^src/store/(admin|postgres)\.rs$''']

[[rules.allowlists]]
description = "The exact reviewed PR-classifier source digest is not a credential"
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*ReviewedFile::new\("script/pr_classification/github_api\.py", "efa4a07f861cbb97534fd8c8615edd85c4fd[a]8729b015e785666ab414b733aa0"\),\s*$''',
]
paths = ['''^tools/maintainability/src/structure/suppression/policy/config/command/actions/guarded\.rs$''']
