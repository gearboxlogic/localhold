name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LOCALHOLD_MAINTAINABILITY_BOOTSTRAP_SHA256: 1d374bff562c4b78c55d917a0626fc877ff34cca40bb5fe765fbc6e1414bc9c5
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache

permissions:
  contents: read

jobs:
  check-linux-baseline:
    name: Reranker Test (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache cargo registry and baseline build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/localhold/cargo/registry
            .cache/localhold/cargo/git
            target
          key: ubuntu-22.04-rust-${{ hashFiles('Cargo.lock', 'mise.lock') }}
          restore-keys: ubuntu-22.04-rust-

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.7.5

      - name: Test reranker-enabled source
        run: cargo test --workspace --locked --features reranker

  check:
    name: Format + Clippy + Deny + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/localhold/cargo/registry
            .cache/localhold/cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'mise.lock') }}
          restore-keys: ${{ runner.os }}-rust-

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.7.5

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly -c rustfmt

      - name: Run CI gate
        run: just check-quality

      - name: Stage CPU installation
        run: ./script/install.sh --profile cpu --prefix "$RUNNER_TEMP/localhold"

      - name: Validate release metadata and archive tooling
        run: |
          python3 -m unittest discover -s script/tests
          python3 script/release.py validate
          tag="$(python3 script/release.py tag)"
          python3 script/package-release.py \
            --tag "$tag" \
            --target x86_64-unknown-linux-gnu \
            --binary target/release/hold \
            --format tar.zst \
            --output-dir "$RUNNER_TEMP/release"
          mkdir "$RUNNER_TEMP/extracted"
          tar --zstd -xf "$RUNNER_TEMP"/release/*.tar.zst -C "$RUNNER_TEMP/extracted"

      - name: Smoke installed and archived CPU binaries
        run: |
          "$RUNNER_TEMP/localhold/bin/hold" --version
          "$RUNNER_TEMP/localhold/bin/hold" --help
          archive="$(find "$RUNNER_TEMP/release" -maxdepth 1 -name '*.tar.zst' -print -quit)"
          archive_root="$(basename "$archive" .tar.zst)"
          archive_binary="$RUNNER_TEMP/extracted/$archive_root/bin/hold"
          "$archive_binary" --version
          "$archive_binary" --help

      - name: Build CUDA preview artifact
        run: just build-release-reranker-cuda

  dependency-unsafe-linux:
    name: Dependency Unsafe (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Install reviewed Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run dependency unsafe gate
        id: audit
        env:
          BASH_ENV: ''
          LD_AUDIT: ''
          LD_LIBRARY_PATH: ''
          LD_PRELOAD: ''
          LOCALHOLD_MAINTAINABILITY_BOOTSTRAP_ACTUAL_SHA256: ${{ hashFiles('script/check-maintainability-bootstrap.sh') }}
          LOCALHOLD_MAINTAINABILITY_BASE_REV: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: |
          if [[ "$LOCALHOLD_MAINTAINABILITY_BOOTSTRAP_ACTUAL_SHA256" != "$LOCALHOLD_MAINTAINABILITY_BOOTSTRAP_SHA256" ]]; then
            printf 'maintainability bootstrap differs from the workflow-reviewed digest\n' >&2
            exit 1
          fi
          ./script/check-maintainability-bootstrap.sh --maintainability

      - name: Upload dependency audit evidence on failure
        if: failure() && steps.audit.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-unsafe-linux-${{ github.sha }}
          path: target/dependency-unsafe/actual-linux
          if-no-files-found: warn
          retention-days: 7

  postgres-smoke:
    name: PostgreSQL + pgvector Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/localhold/cargo/registry
            .cache/localhold/cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'mise.lock') }}
          restore-keys: ${{ runner.os }}-rust-

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.7.5

      - name: Run PostgreSQL pgvector smoke tests
        run: just test-postgres-smoke

  check-windows:
    name: Clippy + Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/localhold/cargo/registry
            .cache/localhold/cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'mise.lock') }}
          restore-keys: ${{ runner.os }}-rust-

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.7.5

      - name: Clippy
        run: |
          just production-clippy
          just clippy

      - name: Test
        run: just test

      - name: Build and package Windows preview archive
        run: |
          cargo build --release --locked --features reranker --target x86_64-pc-windows-msvc
          python script/release.py validate
          tag="$(python script/release.py tag)"
          python script/package-release.py \
            --tag "$tag" \
            --target x86_64-pc-windows-msvc \
            --binary target/x86_64-pc-windows-msvc/release/hold.exe \
            --format zip \
            --output-dir "$RUNNER_TEMP/release"

      - name: Smoke Windows preview archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem "$env:RUNNER_TEMP/release/*.zip" | Select-Object -First 1
          Expand-Archive -Path $archive.FullName -DestinationPath "$env:RUNNER_TEMP/extracted"
          $archiveRoot = [IO.Path]::GetFileNameWithoutExtension($archive.Name)
          $binary = "$env:RUNNER_TEMP/extracted/$archiveRoot/bin/hold.exe"
          & $binary --version
          & $binary --help | Out-Null

  dependency-unsafe-windows:
    name: Dependency Unsafe (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install reviewed Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run dependency unsafe gate
        id: audit
        env:
          BASH_ENV: ''
          LD_AUDIT: ''
          LD_LIBRARY_PATH: ''
          LD_PRELOAD: ''
          LOCALHOLD_MAINTAINABILITY_BOOTSTRAP_ACTUAL_SHA256: ${{ hashFiles('script/check-maintainability-bootstrap.sh') }}
          LOCALHOLD_MAINTAINABILITY_BASE_REV: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: |
          if [[ "$LOCALHOLD_MAINTAINABILITY_BOOTSTRAP_ACTUAL_SHA256" != "$LOCALHOLD_MAINTAINABILITY_BOOTSTRAP_SHA256" ]]; then
            printf 'maintainability bootstrap differs from the workflow-reviewed digest\n' >&2
            exit 1
          fi
          ./script/check-maintainability-bootstrap.sh --maintainability

      - name: Upload dependency audit evidence on failure
        if: failure() && steps.audit.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-unsafe-windows-${{ github.sha }}
          path: target/dependency-unsafe/actual-windows
          if-no-files-found: warn
          retention-days: 7
