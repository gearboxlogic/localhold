name: Trusted Maintainability

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  trusted-maintainability:
    name: Trusted Maintainability Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u LD_AUDIT -u LD_LIBRARY_PATH -u LD_PRELOAD /usr/bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Install reviewed Rust toolchain
        env:
          RUSTUP_DIST_SERVER: https://static.rust-lang.org
          RUSTUP_HOME: ${{ runner.temp }}/localhold-rustup
          RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run approved maintainability bootstrap
        env:
          APPROVED_BOOTSTRAP_SHA256: ${{ vars.LOCALHOLD_MAINTAINABILITY_BOOTSTRAP_SHA256 }}
          LOCALHOLD_MAINTAINABILITY_BASE_REV: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
          RUSTUP_HOME: ${{ runner.temp }}/localhold-rustup
        run: |
          if [[ ! "$APPROVED_BOOTSTRAP_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            printf 'repository maintainability bootstrap approval is missing or malformed\n' >&2
            exit 1
          fi
          actual_bootstrap_sha256=$(/usr/bin/sha256sum -- script/check-maintainability-bootstrap.sh)
          actual_bootstrap_sha256=${actual_bootstrap_sha256%%[[:space:]]*}
          if [[ "${actual_bootstrap_sha256,,}" != "${APPROVED_BOOTSTRAP_SHA256,,}" ]]; then
            printf 'maintainability bootstrap differs from the repository-approved digest\n' >&2
            exit 1
          fi
          /usr/bin/bash script/check-maintainability-bootstrap.sh --maintainability
