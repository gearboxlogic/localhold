name: Trusted Maintainability

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  trusted-maintainability:
    name: Trusted Maintainability Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: /usr/bin/env -u BASH_ENV -u ENV -u GCONV_PATH -u SHELLOPTS -u LD_AUDIT -u LD_LIBRARY_PATH -u LD_PRELOAD /usr/bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Install reviewed Rust toolchain
        env:
          RUSTUP_DIST_SERVER: https://static.rust-lang.org
          RUSTUP_HOME: ${{ runner.temp }}/localhold-rustup
          RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt

      - name: Check out protected gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .trusted-gate
          fetch-depth: 1
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce protected maintainability policy
        working-directory: .candidate
        env:
          BASE_REVISION_INPUT: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          RUSTUP_HOME: ${{ runner.temp }}/localhold-rustup
          RUSTUP_TOOLCHAIN: 1.97.0
        run: |
          workspace_root=$(/usr/bin/realpath -- "$GITHUB_WORKSPACE")
          trusted_root=$(/usr/bin/realpath -- ../.trusted-gate)
          candidate_root=$(/usr/bin/realpath -- .)
          if [[ "$trusted_root" != "$workspace_root/.trusted-gate" || "$candidate_root" != "$workspace_root/.candidate" ]]; then
            printf 'trusted maintainability checkout paths are not canonical\n' >&2
            exit 1
          fi
          readonly workspace_root trusted_root candidate_root

          base_revision=$BASE_REVISION_INPUT
          if [[ "$base_revision" == refs/heads/* ]]; then
            remote_ref="refs/remotes/origin/${base_revision#refs/heads/}"
            base_revision=$(/usr/bin/git rev-parse --verify "${remote_ref}^{commit}")
          fi
          if [[ ! "$base_revision" =~ ^[[:xdigit:]]{40}$ ]]; then
            printf 'maintainability base revision is missing or malformed\n' >&2
            exit 1
          fi
          export LOCALHOLD_MAINTAINABILITY_BASE_REV=${base_revision,,}

          trusted_bootstrap="$trusted_root/script/check-maintainability-bootstrap.sh"
          if [[ ! -f "$trusted_bootstrap" || -L "$trusted_bootstrap" ]]; then
            printf 'protected maintainability bootstrap is missing or unsafe\n' >&2
            exit 1
          fi
          readonly trusted_bootstrap
          /usr/bin/bash "$trusted_bootstrap" --root "$candidate_root" --maintainability

  trusted-dependency-unsafe-windows:
    name: Trusted Dependency Unsafe (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference = ''Stop''; $env:BASH_ENV = $null; $env:ENV = $null; $env:GCONV_PATH = $null; $env:SHELLOPTS = $null; $env:LD_AUDIT = $null; $env:LD_LIBRARY_PATH = $null; $env:LD_PRELOAD = $null; & ''C:\Program Files\Git\bin\bash.exe'' --noprofile --norc -e -o pipefail ''{0}''; exit $LASTEXITCODE"'
    steps:
      - name: Install reviewed Rust toolchain
        env:
          RUSTUP_DIST_SERVER: https://static.rust-lang.org
          RUSTUP_HOME: ${{ runner.temp }}/localhold-rustup
          RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt

      - name: Check out protected gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .trusted-gate
          fetch-depth: 1
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          path: .candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce protected Windows dependency policy
        working-directory: .candidate
        env:
          BASE_REVISION_INPUT: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          RUSTUP_HOME: ${{ runner.temp }}/localhold-rustup
          RUSTUP_TOOLCHAIN: 1.97.0
        run: |
          workspace_root=$(/usr/bin/cygpath -u -- "$GITHUB_WORKSPACE")
          workspace_root=$(/usr/bin/realpath -- "$workspace_root")
          protected_root=$(/usr/bin/realpath -- ../.trusted-gate)
          audit_root=$(/usr/bin/realpath -- .)
          if [[ "$protected_root" != "$workspace_root/.trusted-gate" || "$audit_root" != "$workspace_root/.candidate" ]]; then
            printf 'trusted Windows dependency-audit checkout paths are not canonical\n' >&2
            exit 1
          fi
          readonly workspace_root protected_root audit_root

          windows_base_revision=$BASE_REVISION_INPUT
          if [[ "$windows_base_revision" == refs/heads/* ]]; then
            remote_ref="refs/remotes/origin/${windows_base_revision#refs/heads/}"
            windows_base_revision=$(git rev-parse --verify "${remote_ref}^{commit}")
          fi
          if [[ ! "$windows_base_revision" =~ ^[[:xdigit:]]{40}$ ]]; then
            printf 'Windows dependency-audit base revision is missing or malformed\n' >&2
            exit 1
          fi
          export LOCALHOLD_MAINTAINABILITY_BASE_REV=${windows_base_revision,,}

          protected_bootstrap="$protected_root/script/check-maintainability-bootstrap.sh"
          if [[ ! -f "$protected_bootstrap" || -L "$protected_bootstrap" ]]; then
            printf 'protected Windows dependency-audit bootstrap is missing or unsafe\n' >&2
            exit 1
          fi
          readonly protected_bootstrap
          /usr/bin/bash "$protected_bootstrap" --root "$audit_root" --dependency-unsafe
