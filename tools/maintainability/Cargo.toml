[package]
name = "localhold-maintainability"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "localhold-maintainability"
path = "src/main.rs"

[workspace]

[dependencies]
anyhow = "=1.0.103"
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
quote = "=1.0.45"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
syn = { version = "=2.0.117", features = ["fold", "full", "visit"] }
toml = "=1.1.0"

[dev-dependencies]
tempfile = "=3.26.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
